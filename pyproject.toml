[project]
dependencies = [
  "flash-linear-attention==0.4.1",
  "mbridge",
  "tilelang>=0.1.7.post3",
  "transformer_engine[pytorch]==2.13.*",
  "sglang",
  "torch==2.9.1",
  "apex",
  "megatron-core",
  "torch-memory-saver",
  "megatron-bridge",
  "accelerate>=1.12.0",
  "blobfile>=3.0.0",
  "datasets>=2.14.4",
  "httpx[http2]>=0.28.1",
  "mcp[cli]>=1.26.0",
  "memray>=1.19.1",
  "omegaconf>=2.3.0",
  "pillow>=12.1.0",
  "pylatexenc>=3.0a33",
  "pyyaml>=6.0.3",
  "qwen-vl-utils>=0.0.14",
  "ray[default]>=2.53.0",
  "ring-flash-attn>=0.1.8",
  "sglang-router>=0.2.3",
  "tensorboard>=2.20.0",
  "transformers>=4.57.1",
  "wandb>=0.24.2",
  "numpy<2",
  "ipython>=9.9.0",
  "slime",
  "rl-web-agent",
  "flash-attn>=2.8.3",
  "weave>=0.52.26",
  "batch-inference",
  "litellm>=1.80.0",
  "nvidia-nvshmem-cu12>=3.3.20",
  "nltk>=3.9.2",
  "aioboto3==15.5.0",
  "multi-storage-client[boto3]>=0.42.0",
  "matplotlib>=3.10.8",
  "anyio>=4.12.1",
  "bfcl_eval",
  "cuda-python==12.8.*",
  "mooncake-transfer-engine",
  "uccl-ep",
  "deep-ep",
  "typer>=0.21.1",
  "websockets>=16.0",
]
description = "Add your description here"
name = "slime-uv"
readme = "README.md"
requires-python = "==3.12.*"
version = "0.1.0"

[tool.uv.sources]
apex = {git = "https://github.com/NVIDIA/apex.git", rev = "10417aceddd7d5d05d7cbf7b0fc2daad1105f8b4"}
mbridge = {git = "https://github.com/ISEEKYAN/mbridge.git", rev = "89eb10887887bc74853f89a4de258c0702932a1c"}
megatron-bridge = {git = "https://github.com/fzyzcjy/Megatron-Bridge.git", rev = "dev_rl"}
megatron-core = {git = "https://github.com/anonymous/Megatron-LM.git", rev = "slime_patch_v2"}
sglang = {git = "https://github.com/anonymous/sglang.git", subdirectory = "python", rev = "slime_patch"}
slime = {path = "dependencies/slime", editable = true}
rl-web-agent = {path = "dependencies/rl_web_agent", editable = true}
torch = [
  {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
torch-memory-saver = {git = "https://github.com/fzyzcjy/torch_memory_saver.git", rev = "dc6876905830430b5054325fa4211ff302169c6b"}
torchvision = [
  {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
batch-inference = { git = "ssh://git@github.com/anonymous/bedrock-batch-inference-bridge.git" }
bfcl_eval = {path = "dependencies/bfcl", editable = true}
sglang-router = { url = "https://github.com/zhuzilin/sgl-router/releases/download/v0.3.2-5f8d397/sglang_router-0.3.2-cp38-abi3-manylinux_2_28_x86_64.whl" }
mooncake-transfer-engine = { path = "wheels/mooncake_transfer_engine-0.3.10.post2-cp312-cp312-manylinux_2_39_x86_64.whl" }
uccl-ep = { path = "wheels/uccl_ep-0.0.2+a1ef8418-cp312-abi3-linux_x86_64.whl" }
deep-ep = { path = "wheels/deep_ep-0.1.1-py3-none-any.whl" }

[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]
version = "2.7.4.post1"
[tool.uv]
default-groups = ["build"]
no-build-isolation-package = [
  "flash-attn",
  "transformer-engine",
  "transformer-engine-cu12",
  "transformer-engine-torch",
  "apex",
]
override-dependencies = [
  "nvidia-cudnn-cu12==9.16.0.29",
  "sglang>=0",  # override rl-web-agent's sglang pin; we use our own fork
]
prerelease = "allow"

[[tool.uv.index]]
explicit = true
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[dependency-groups]
build = [
    "sglang",
    "torch==2.9.1",
    "poetry",
    "nvidia-nvshmem-cu12>=3.3.20",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[tool.setuptools.packages.find]
include = ["shared*", "scripts*", "tool_call_agent*", "web_agent*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["dependencies"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
exclude = ["*.ipynb"]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",   # line too long (formatter handles this)
  "SIM108", # ternary operator (readability preference)
  "SIM401", # dict.get() vs if/else (generate.py intentionally avoids .get() to fail fast)
]
